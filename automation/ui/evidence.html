<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>证据工作台</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#202b39;background:#f4f6f8;line-height:1.6;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #42a898;outline-offset:2px}header{background:#142e3a;color:white;padding:26px 5vw 22px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:0 0 5px;letter-spacing:.05em}header p{margin:0;color:#bdd2da;font-size:13px}button{border:1px solid #d8e0e7;border-radius:7px;padding:8px 13px;background:white;color:#23424a}header button{background:#244651;border-color:#42616b;color:white}.wrap{max-width:1460px;margin:auto;padding:22px 4vw}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid #e3e8ed;padding:15px 18px;border-radius:9px}.stat strong{display:block;font-size:27px;color:#1b5f5c}.stat span{color:#667583;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:9px 12px;border:1px solid #d5dde4;background:white;border-radius:7px}input{min-width:230px;flex:1}nav{display:flex;gap:6px;margin:0 0 18px;border-bottom:1px solid #dce3e8;padding-bottom:10px}.selected{background:#e3f1ef;border-color:#5b9d95;color:#165c52}main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}.list,.detail,.panel{background:white;border:1px solid #dfe6eb;border-radius:9px;overflow:hidden}.list{max-height:75vh;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f3;border-radius:0;padding:17px 18px}.item:hover{background:#f1f7f6}.item.active{background:#e8f4f1;border-left:3px solid #218375;padding-left:15px}.item strong{display:block;font-size:14px;overflow-wrap:anywhere}.muted{color:#6a7785;font-size:12px}.id{font-family:Consolas,monospace;font-size:11px;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:11px;background:#f0f3f6;color:#637080;margin:4px 6px 0 0}.eligible{background:#dff2e9;color:#19694d}.invalid{background:#fbe9e6;color:#a14132}.needs-review{background:#fff0d8;color:#8c5e1c}.detail{padding:24px;min-height:480px}.detail h2{margin:0;font-size:19px;overflow-wrap:anywhere}.detail h3{font-size:13px;color:#557077;margin:24px 0 9px}.detail p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.detail ul{padding-left:20px;overflow-wrap:anywhere}.card{border:1px solid #e4e9ed;border-radius:7px;padding:13px 15px;margin:9px 0;background:#fafcfd}.card pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#657281}.error{padding:13px 17px;background:#fff0e9;border:1px solid #eebda9;border-radius:7px;margin:0 0 15px;white-space:pre-wrap}.empty{padding:35px 20px;color:#6e7c88;text-align:center}.notes{font-size:12px;color:#788591;margin:15px 0}#monitor{display:none}.panel{padding:22px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 10px}.event{border-bottom:1px solid #e6ecef;padding:12px 0}.event:last-child{border:0}dialog{border:1px solid #cad7de;border-radius:10px;max-width:960px;width:85vw;max-height:85vh;padding:22px}dialog::backdrop{background:#132f3b88}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto;background:#f2f5f7;padding:15px}dialog button{float:right}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.time{font-size:11px;color:#79909c}details summary{cursor:pointer;color:#576e7a;font-size:12px}#count{margin:0 0 10px;font-size:12px;color:#677b85}@media(max-width:800px){header{padding:20px;align-items:flex-start}.wrap{padding:16px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}main{grid-template-columns:1fr}.list{max-height:280px}.detail{padding:18px}input{min-width:100%}header p{max-width:230px}}
</style>
</head>
<body>
<header><div><h1>证据工作台</h1><p>看见依据，追溯确认，检查影响。</p></div><div><button id="refresh">刷新当前证据</button><p id="stamp" class="time"></p></div></header>
<div class="wrap">
<div id="alert" class="error" hidden role="alert"></div>
<div class="stats" id="stats"></div>
<nav aria-label="查看模式"><button id="evidence-tab" class="selected">证据与结论</button><button id="monitor-tab">监测与维护候选</button></nav>
<section id="evidence"><div class="toolbar"><input id="search" aria-label="搜索证据" placeholder="搜索结论、对象 ID、保存原因或确认人…"><select id="kind" aria-label="对象类型"><option value="">全部对象</option><option value="claim">结论</option><option value="run">实验 / 分析 Run</option><option value="research">研究</option><option value="algorithm">核心算法</option><option value="report">报告</option><option value="knowledge">知识</option></select><select id="state" aria-label="证据状态"><option value="">全部状态</option><option value="eligible">符合正式条件</option><option value="needs-review">待复核 / 未登记结论</option><option value="invalid">存在失效风险</option></select></div><p id="count"></p><main><div id="list" class="list" aria-label="证据列表"></div><article id="detail" class="detail" aria-live="polite"></article></main></section>
<section id="monitor"><div class="panel"><h2>只读监测</h2><p id="monitor-status"></p><p class="notes">只比较获准材料与记录的变化。下列时间是观察时间；实验完成不等于结论正确。</p></div><div class="panel"><h2>待处理候选</h2><div id="candidates"></div></div><div class="panel"><h2>最近观察事件</h2><div id="events"></div></div></section>
<p class="notes">可信状态依据复核和适用的验证流程。重复出现、重复被引用，都不构成独立验证。此界面只读，不修改材料或复核状态。</p>
</div>
<dialog id="source-dialog"><button id="close-source">关闭</button><h2>来源预览（当前原件）</h2><p id="source-location"></p><pre id="source-text"></pre></dialog>
<script id="evidence-data" type="application/json">__EVIDENCE_DATA__</script>
<script>
// 数据永远通过 textContent 展示；不将文件、结论、路径或复核意见拼入 HTML。
const LIVE=__LIVE_MODE__;let payload=JSON.parse(document.getElementById('evidence-data').textContent),selected=null;
const $=id=>document.getElementById(id),labels={claim:'结论',run:'Run',research:'研究',algorithm:'核心算法',report:'报告',knowledge:'知识',eligible:'符合正式条件','needs-review':'待复核 / 未登记结论',invalid:'存在失效风险',accepted:'已记录确认','not-reviewed':'未复核',disputed:'有争议',retracted:'已撤回',superseded:'已替代',supports:'支持依据',input:'输入',background:'背景',contradicts:'反证'};
const eventLabels={'material-added':'发现材料','material-changed':'材料发生变化','material-out-of-scope':'材料已不在本次扫描清单','record-added':'发现记录','record-removed':'记录已不在本次证据图','experiment-finished':'观察到实验结束','execution-changed':'执行状态变化','dependency-risk':'依赖风险变化','risk-cleared-observed':'本次未再观察到原风险','review-changed':'复核记录变化'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function fmt(t){if(!t)return '未记录';const d=new Date(t);return isNaN(d)?String(t):d.toLocaleString('zh-CN',{hour12:false})}
function badge(value){return el('span',labels[value]||value,'badge '+value)}
function section(title,content){const box=el('section');box.append(el('h3',title));if(typeof content==='string')box.append(el('p',content));else box.append(content);return box}
function showAlert(message){$('alert').hidden=!message;$('alert').textContent=message||''}
function activate(id){selected=id;renderList();renderDetail()}
function nodeButton(id){const n=payload.nodes[id],b=el('button',n?(n.kind==='claim'?'结论 · ':'')+id:id);b.onclick=()=>{tab(false);activate(id)};return b}
function renderStats(){const nodes=Object.values(payload.nodes),claims=nodes.filter(n=>n.kind==='claim'),items=[['已登记对象',nodes.filter(n=>n.kind!=='claim').length],['已登记结论',claims.length],['符合正式条件',claims.filter(n=>n.formal_eligible).length],['存在风险',nodes.filter(n=>n.state==='invalid').length]];$('stats').replaceChildren(...items.map(([label,num])=>{const box=el('div',undefined,'stat');box.append(el('strong',String(num)),el('span',label));return box}));$('stamp').textContent=(LIVE?'读取于 ':'快照生成于 ')+fmt(payload.observed_at)}
function renderList(){const q=$('search').value.trim().toLocaleLowerCase(),kind=$('kind').value,state=$('state').value;const all=Object.values(payload.nodes);const nodes=all.filter(n=>(!kind||n.kind===kind)&&(!state||n.state===state)&&(!q||[n.id,n.title,n.statement,n.record_reason,n.scope,n.review.reviewer].join(' ').toLocaleLowerCase().includes(q)));$('count').textContent='显示 '+nodes.length+' / '+all.length+' 条记录'+(all.some(n=>n.kind==='claim')?'':' · 目前还没有逐条结论，历史 Run 仍可查看');$('list').replaceChildren();for(const n of nodes){const b=el('button',undefined,'item'+(selected===n.id?' active':''));b.append(el('span',labels[n.kind],'muted'),el('strong',n.title),el('div',n.id,'id'),badge(n.state));b.onclick=()=>activate(n.id);$('list').append(b)}if(!nodes.length)$('list').append(el('div','没有匹配记录。可清空筛选；真实材料尚未登记时不会填入示例结论。','empty'))}
async function preview(id,index,group){if(!LIVE){showAlert('当前为离线快照。来源路径与定位已列出；启动 evidence-view --serve 可预览文本。');return}try{const response=await fetch('api/source?id='+encodeURIComponent(id)+'&fingerprint='+encodeURIComponent(payload.nodes[id].fingerprint)+(index===undefined?'':'&ref='+index)+(group?'&group='+encodeURIComponent(group):''));const x=await response.json();if(!response.ok)throw Error(x.error);$('source-location').textContent=x.path+' · '+x.locator+(x.truncated?' · 仅展示前 64 KiB':'');$('source-text').textContent=x.text;$('source-dialog').showModal()}catch(error){showAlert('来源读取失败：'+error.message)}}
// Run 输入和产物是执行记录，单独展示，不伪装成逐条已复核的支持引用。
function renderAssets(container,node){
  if(!node.assets?.length)return;
  const box=el('details');box.append(el('summary','展开 '+node.assets.length+' 项输入与产物'));
  for(const asset of node.assets){
    const card=el('div',undefined,'card');
    card.append(el('strong',asset.group==='inputs'?'输入':'产物'),el('p',asset.path,'id'),el('p',asset.error||(asset.version_matches?'当前指纹一致':'指纹未固定或发生变化'),'muted'));
    const button=el('button','预览当前文件');button.onclick=()=>preview(node.id,asset.index,asset.group);card.append(button);box.append(card);
  }
  container.append(section('Run 的输入与产物',box));
}
function renderDetail(){const n=payload.nodes[selected];const d=$('detail');d.replaceChildren();if(!n){d.append(el('div','选择一条记录，查看保存原因、依据、复核与下游报告。','empty'));return}d.append(el('h2',n.title),el('p',n.id+' · '+(labels[n.kind]||n.kind),'id'),badge(n.state),badge(n.review.status||'not-reviewed'));if(n.execution_status)d.append(el('p','执行状态：'+n.execution_status,'muted'));if(n.statement)d.append(section(n.kind==='claim'?'具体结论':'记录中的结果摘要',n.statement));d.append(section('为什么保存',n.record_reason+(n.reason_source?'\n来源：'+n.reason_source:'')));d.append(section('适用范围',n.scope||'未单独登记；容器中的各条结论需要分别声明范围。'));const source=el('div');source.append(el('p',n.document_path||n.path,'id'));const b=el('button','查看元数据');b.onclick=()=>preview(n.id);source.append(b);d.append(section('记录位置',source));const refs=el('div');if(!n.refs.length)refs.append(el('p','未登记结构化证据引用；已有正文或摘要不会自动成为已复核依据。','muted'));n.refs.forEach((ref,i)=>{const card=el('div',undefined,'card');card.append(badge(ref.relation||'未知关系'),el('p',ref.target,'id'),el('p','定位：'+(ref.locator||'未记录')),el('p',ref.error|| (ref.version_matches?'当前版本与登记指纹一致':'当前版本未固定或已变化'),'muted'));const hashes=el('details');hashes.append(el('summary','查看版本指纹'),el('pre','登记：'+(ref.sha256||'未固定')+'\n当前：'+(ref.current_sha256||'不可用')));const button=el('button','查看依据');button.onclick=()=>preview(n.id,i);card.append(hashes,button);refs.append(card)});d.append(section('依据在哪里',refs));renderAssets(d,n);const review=el('div');review.append(el('p','确认人：'+(n.review.reviewer||'未记录')+'\n记录时间：'+fmt(n.review.date)+'\n复核理由：'+(n.review.reason||'未记录')+'\n复核依据：'+(n.review.evidence||'未记录')));if(n.review_history.length){const history=el('details');history.append(el('summary','展开 '+n.review_history.length+' 条复核历史'));for(const h of n.review_history){const v=h.current||h;history.append(el('p',fmt(v.date)+' · '+(v.reviewer||'未记录')+' · '+(labels[v.status]||v.status||'未知')+'\n'+(v.reason||''),'card'))}review.append(history)}d.append(section('谁确认过',review));const risk=el('div');if(n.risks.length){risk.append(el('p',n.risks.join('\n')));const t=payload.monitor?.invalid_since?.[n.id];risk.append(el('p',t?'监测首次观察到当前风险：'+fmt(t)+'（不等于实际发生时间）':'尚无监测观察时间。','muted'))}else risk.append(el('p','当前未发现已登记依赖的失效风险；这不等于科学结论已验证。','muted'));if(['retracted','disputed','superseded'].includes(n.review.status))risk.append(el('p','复核记录中的状态变更时间：'+fmt(n.review.date)));if(n.kind==='claim'&&n.formal_errors.length){const more=el('details');more.append(el('summary','为何未满足正式使用条件'),el('p',n.formal_errors.join('\n')));risk.append(more)}d.append(section('何时失效 / 当前限制',risk));const reports=el('div');if(!n.reports.length)reports.append(el('p','尚无已登记的下游报告依赖；未登记的引用不能自动追溯。','muted'));for(const rep of n.reports){const row=el('div',undefined,'card');row.append(nodeButton(rep.id),el('p',rep.path,'id'),el('p',rep.chain.join(' → '),'muted'));reports.append(row)}d.append(section('哪些报告需要关注',reports));if(n.dependencies.length){const dep=el('div',undefined,'row');for(const id of n.dependencies)dep.append(nodeButton(id));d.append(section('已登记的上游对象',dep))}}
function renderMonitor(){const m=payload.monitor;$('monitor-status').textContent=!m?'尚未建立监测基线。运行 evidence-monitor 后会显示观察记录。':m.error?'监测记录不可用：'+m.error:'最近监测：'+fmt(m.last_checked)+'。刷新网页只重新读取证据，不执行监测任务。';const candidates=(m?.candidates||[]).filter(c=>c.status==='pending');$('candidates').replaceChildren();for(const c of candidates){const row=el('div',undefined,'card');row.append(el('strong',c.reason),el('p',c.targets.join(' · '),'id'),el('p','首次观察：'+fmt(c.first_seen)+' · '+c.id,'time'));for(const id of c.targets)if(payload.nodes[id])row.append(nodeButton(id));$('candidates').append(row)}if(!candidates.length)$('candidates').append(el('p','暂无待处理候选。重复内容只会形成比较候选，不提升可信状态。','muted'));$('events').replaceChildren();for(const event of (m?.events||[]).slice(-100).reverse()){const row=el('div',undefined,'event');row.append(el('strong',eventLabels[event.kind]||event.kind),el('p',event.target,'id'),el('p',fmt(event.observed_at)+' · '+event.id,'time'));const det=el('details');det.append(el('summary','比较前后记录'),el('pre',JSON.stringify({before:event.before,after:event.after},null,2)));row.append(det);$('events').append(row)}if(!m?.events?.length)$('events').append(el('p','尚无变化事件。首次监测只建立基线，不把已有实验算作刚完成。','muted'));else if(m.events.length>100)$('events').append(el('p','界面显示最近 100 条；更早事件保留在监测记录中。','muted'))}
function tab(monitor){$('evidence').style.display=monitor?'none':'block';$('monitor').style.display=monitor?'block':'none';$('evidence-tab').classList.toggle('selected',!monitor);$('monitor-tab').classList.toggle('selected',monitor)}
function renderAll(){renderStats();renderList();renderDetail();renderMonitor();showAlert(payload.errors.length?'证据图不完整：\n'+payload.errors.join('\n'):null)}
['search','kind','state'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderList));$('evidence-tab').onclick=()=>tab(false);$('monitor-tab').onclick=()=>tab(true);$('close-source').onclick=()=>$('source-dialog').close();$('refresh').onclick=async()=>{if(!LIVE){showAlert('当前为离线快照。重新运行 evidence-view 生成最新快照，或使用 --serve 启动本地查看。');return}const button=$('refresh');button.disabled=true;try{const res=await fetch('api/state');const x=await res.json();if(!res.ok)throw Error(x.error);payload=x;renderAll()}catch(err){showAlert('刷新失败，当前仍显示旧快照：'+err.message)}finally{button.disabled=false}};if(!LIVE)$('refresh').textContent='离线快照 · 如何刷新';renderAll();
</script>
</body></html>
